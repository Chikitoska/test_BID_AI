[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
addopts = -v -s --tb=short
markers =
    smoke: быстрые smoke-тесты
    api: backend / HTTP тесты
    ui: Selenium UI тесты
    selenium: UI-тесты на Selenium WebDriver
    playwright: UI-тесты на Playwright
    network: проверка сетевых запросов браузера
    lk: автотесты личного кабинета (Keycloak + 2FA)
    lk_be: BE API smoke ЛК после FE-логина (Bearer/cookie → GET polling)

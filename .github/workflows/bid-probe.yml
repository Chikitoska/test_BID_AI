name: BID Probe (manual test only)

# Мониторинг только на RU VPS (157.22.191.247). Облако GitHub НЕ достучится до BID.
# НЕ добавлять schedule — иначе ложные FAIL и спам в Telegram.
# Тест алертов: workflow "BID Telegram Relay"

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: HTTP probe (no alerts from cloud)
        env:
          TELEGRAM_BOT_TOKEN: ""
          TELEGRAM_CHAT_ID: ""
          TELEGRAM_ALERT_ON_SUCCESS: "false"
          MONITOR_ALERT_AFTER_FAILURES: "99"
        run: python monitor/run_light.py

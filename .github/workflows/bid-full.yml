name: BID Full Check (manual test only)

# Мониторинг только на RU VPS. Облако GitHub не используется для prod.
# НЕ добавлять schedule.

on:
  workflow_dispatch:

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: HTTP + pytest (no alerts from cloud)
        env:
          TELEGRAM_BOT_TOKEN: ""
          TELEGRAM_CHAT_ID: ""
          TELEGRAM_ALERT_ON_SUCCESS: "false"
          TELEGRAM_FULL_RUN_SUMMARY: "false"
        run: python monitor/run_daily.py

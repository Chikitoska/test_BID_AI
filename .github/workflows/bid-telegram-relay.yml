name: BID Telegram Relay

# FirstVDS шлёт repository_dispatch после probe → GitHub шлёт Telegram.
# GitHub не достучится до InfluxDB на VPS — только push-модель.
on:
  repository_dispatch:
    types: [bid-probe]
  workflow_dispatch:
    inputs:
      status:
        description: "Probe status (для теста)"
        required: true
        default: ok
        type: choice
        options:
          - ok
          - fail

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: relay-state.txt
          key: bid-relay-state-v1

      - run: pip install requests --timeout 120

      - name: Set probe env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "PROBE_STATUS=${{ inputs.status }}" >> "$GITHUB_ENV"
            echo "PROBE_FAILED_COUNT=0" >> "$GITHUB_ENV"
            echo "PROBE_DURATION_SEC=" >> "$GITHUB_ENV"
          else
            echo "PROBE_STATUS=${{ github.event.client_payload.status }}" >> "$GITHUB_ENV"
            echo "PROBE_FAILED_COUNT=${{ github.event.client_payload.failed_count }}" >> "$GITHUB_ENV"
            echo "PROBE_DURATION_SEC=${{ github.event.client_payload.duration_sec }}" >> "$GITHUB_ENV"
          fi

      - name: Relay → Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RELAY_STATE_FILE: relay-state.txt
        run: python monitor/telegram_relay.py

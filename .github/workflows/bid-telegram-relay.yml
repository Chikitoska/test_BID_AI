name: BID Telegram Relay

# FirstVDS шлёт repository_dispatch после probe → GitHub шлёт Telegram.
on:
  repository_dispatch:
    types: [bid-probe]
  workflow_dispatch:
    inputs:
      status:
        description: "Probe status (для теста)"
        required: true
        default: ok
        type: choice
        options:
          - ok
          - fail

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - run: pip install requests --timeout 120

      - name: Set probe env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "PROBE_STATUS=${{ inputs.status }}" >> "$GITHUB_ENV"
            echo "RUN_TYPE=probe" >> "$GITHUB_ENV"
            echo "PYTEST_FAILED=0" >> "$GITHUB_ENV"
            echo "PYTEST_TOTAL=0" >> "$GITHUB_ENV"
            if [ "${{ inputs.status }}" = "fail" ]; then
              echo 'PROBE_FAILURES_JSON=[{"name":"main_page","label":"Главная страница лендинга","status":"502","detail":"HTTP 502: Bad Gateway"}]' >> "$GITHUB_ENV"
            else
              echo "PROBE_FAILURES_JSON=[]" >> "$GITHUB_ENV"
            fi
          else
            echo "PROBE_STATUS=${{ github.event.client_payload.status }}" >> "$GITHUB_ENV"
            echo "RUN_TYPE=${{ github.event.client_payload.run_type || 'probe' }}" >> "$GITHUB_ENV"
            echo "PYTEST_FAILED=${{ github.event.client_payload.pytest_failed || 0 }}" >> "$GITHUB_ENV"
            echo "PYTEST_TOTAL=${{ github.event.client_payload.pytest_total || 0 }}" >> "$GITHUB_ENV"
            {
              echo "PYTEST_ERROR<<EOF"
              echo '${{ github.event.client_payload.pytest_error }}'
              echo "EOF"
            } >> "$GITHUB_ENV"
            {
              echo "PROBE_FAILURES_JSON<<EOF"
              echo '${{ github.event.client_payload.failures_json }}'
              echo "EOF"
            } >> "$GITHUB_ENV"
          fi

      - name: Relay alert (Telegram + email)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
        run: python monitor/telegram_relay.py
